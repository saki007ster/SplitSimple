name: Database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Create and verify backup
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.BACKUP_DATABASE_URL }}
        run: ./scripts/backup-database.sh ./backups
      - name: Store backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: splitsimple-database-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 14
          if-no-files-found: error
